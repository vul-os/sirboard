<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="SirBoard">
  <title>SirBoard</title>

  <!-- soldermask: the matte black the boards actually ship in -->
  <rect width="128" height="128" rx="28" fill="#0d0d11"/>

  <!-- gold legs, breaking the package out to the edge of the board -->
  <g fill="#e0b355">
    <rect x="8"  y="40"   width="34" height="9" rx="4.5"/>
    <rect x="8"  y="59.5" width="34" height="9" rx="4.5"/>
    <rect x="8"  y="79"   width="34" height="9" rx="4.5"/>
    <rect x="86" y="40"   width="34" height="9" rx="4.5"/>
    <rect x="86" y="59.5" width="34" height="9" rx="4.5"/>
    <rect x="86" y="79"   width="34" height="9" rx="4.5"/>
  </g>

  <!-- the package body -->
  <rect x="38" y="30" width="52" height="68" rx="9" fill="#0d0d11" stroke="#e0b355" stroke-width="9"/>

  <!-- pin-1 marker -->
  <circle cx="52.5" cy="44.5" r="5.5" fill="#e0b355"/>
</svg>
