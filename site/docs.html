      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }

<script>
(function () {
  var root = document.documentElement;

  var ICON = {
    book:   '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
    play:   '<path d="M5 3l14 9-14 9V3z"/>',
    chip:   '<rect x="7" y="7" width="10" height="10" rx="1"/><path d="M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4"/>',
    board:  '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1.6"/><circle cx="16" cy="16" r="1.6"/><path d="M8 9.6V14a2 2 0 0 0 2 2h4.4"/>',
    wave:   '<path d="M2 12h3l2.5-7 4 14 3-9 2.5 2H22"/>',
    save:   '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',
    pen:    '<path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.6 7.6"/><circle cx="11" cy="11" r="2"/>',
    plug:   '<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>',
    layers: '<path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/>',
    users:  '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/>'
  };

  var GROUPS = [
    { label: 'Start here', docs: [
      { slug: 'overview',        title: 'Overview',          src: 'docs/OVERVIEW.md',        icon: 'book' },
      { slug: 'getting-started', title: 'Getting started',   src: 'docs/GETTING-STARTED.md', icon: 'play' }
    ]},
    { label: 'The catalogue', docs: [
      { slug: 'breakouts', title: 'Breakout adapters',   src: 'docs/BREAKOUTS.md', icon: 'chip'  },
      { slug: 'boards',    title: 'Development boards',  src: 'docs/BOARDS.md',    icon: 'board' },
      { slug: 'sensors',   title: 'Sensors',             src: 'docs/SENSORS.md',   icon: 'wave'  },
      { slug: 'modules',   title: 'Modules',             src: 'docs/MODULES.md',   icon: 'save'  },
      { slug: 'fritzing',  title: 'Fritzing parts',      src: 'docs/FRITZING.md',  icon: 'pen'   }
    ]},
    { label: 'Reference', docs: [
      { slug: 'libraries',     title: 'Driver libraries', src: 'docs/LIBRARIES.md',     icon: 'plug'   },
      { slug: 'manufacturing', title: 'Manufacturing',    src: 'docs/MANUFACTURING.md', icon: 'layers' },
      { slug: 'contributing',  title: 'Contributing',     src: 'CONTRIBUTING.md',       icon: 'users'  }
    ]}
  ];

  var DOCS = GROUPS.reduce(function (a, g) { return a.concat(g.docs); }, []);
  var bySlug = {};
  DOCS.forEach(function (d) { bySlug[d.slug] = d; });

  /* filename → slug, so cross-doc .md links resolve inside the viewer */
  var byFile = {};
  DOCS.forEach(function (d) { byFile[d.src.split('/').pop().toLowerCase()] = d.slug; });
  byFile['readme.md'] = 'overview';

  var REPO = 'https://github.com/vul-os/sirboard/blob/master/';
  var RAW  = 'https://github.com/vul-os/sirboard/raw/master/';

  var content  = document.getElementById('content');
  var crumbNow = document.getElementById('crumbNow');
  var srcLink  = document.getElementById('srcLink');
  var navList  = document.getElementById('navList');
  var pager    = document.getElementById('pager');
  var outline  = document.getElementById('outline');
  var outlineL = document.getElementById('outlineList');
  var navCur   = document.getElementById('navCur');

  navList.innerHTML = GROUPS.map(function (g) {
    return '<div class="nav-group" data-group><div class="label">' + g.label + '</div>' +
      g.docs.map(function (d) {
        return '<a data-slug="' + d.slug + '" href="#' + d.slug + '">' +
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          (ICON[d.icon] || ICON.book) + '</svg>' + d.title + '</a>';
      }).join('') + '</div>';
  }).join('');

  if (window.marked && marked.setOptions) marked.setOptions({ gfm: true, breaks: false });

  function slugify(s) {
    return String(s).toLowerCase().trim()
      .replace(/[`*~]/g, '')
      .replace(/[^\p{L}\p{N}_\- ]+/gu, '')
      .replace(/ /g, '-') || 'section';
  }

  function parseHash() {
    var raw = (location.hash || '').replace(/^#/, '');
    if (!raw) return { slug: DOCS[0].slug, anchor: '' };
    var bits = raw.split(':');
    if (!bySlug[bits[0]]) return { slug: DOCS[0].slug, anchor: '' };
    return { slug: bits[0], anchor: bits[1] || '' };
  }

  function rewriteLink(a, slug) {
    var href = a.getAttribute('href') || '';
    if (!href) return;
    if (/^(https?:)?\/\//i.test(href) || /^mailto:/i.test(href)) { a.target = '_blank'; a.rel = 'noopener'; return; }
    if (href.charAt(0) === '#') { a.setAttribute('href', '#' + slug + ':' + href.slice(1)); return; }
    var m = href.match(/^(?:\.\.\/)*(?:docs\/)?([^\/#?]+\.md)(?:#(.+))?$/i);
    if (m) {
      var target = byFile[m[1].toLowerCase()];
      if (target) { a.setAttribute('href', '#' + target + (m[2] ? ':' + m[2] : '')); return; }
    }
    /* anything else — a design directory, a licence — goes to the repository */
    a.setAttribute('href', REPO + href.replace(/^(?:\.\.\/)+/, ''));
    a.target = '_blank'; a.rel = 'noopener';
  }

  function decorate(slug) {
    var used = {}, items = [];
    [].slice.call(content.querySelectorAll('h2, h3, h4')).forEach(function (h) {
      var id = slugify(h.textContent);
      if (used[id]) { used[id]++; id += '-' + used[id]; } else { used[id] = 1; }
      h.id = id;
      var a = document.createElement('a');
      a.className = 'anchor'; a.href = '#' + slug + ':' + id;
      a.setAttribute('aria-label', 'Link to this section'); a.textContent = '#';
      h.insertBefore(a, h.firstChild);
      if (h.tagName !== 'H4') items.push({ id: id, text: h.textContent.replace(/^#/, '').trim(), level: h.tagName === 'H3' ? 3 : 2 });
    });

    if (items.length > 2) {
      outlineL.innerHTML = items.map(function (it) {
        return '<a class="' + (it.level === 3 ? 'h3' : '') + '" href="#' + slug + ':' + it.id + '">' + it.text + '</a>';
      }).join('');
      outline.hidden = false;
    } else { outline.hidden = true; outlineL.innerHTML = ''; }

    content.querySelectorAll('a[href]').forEach(function (a) { rewriteLink(a, slug); });

    content.querySelectorAll('img').forEach(function (img) {
      var s = img.getAttribute('src') || '';
      if (!/^https?:/i.test(s)) img.setAttribute('src', RAW + s.replace(/^(?:\.\.\/)+/, ''));
      img.loading = 'lazy';
    });

    content.querySelectorAll('table').forEach(function (t) {
      if (t.parentElement && t.parentElement.classList.contains('md-table-wrap')) return;
      var w = document.createElement('div'); w.className = 'md-table-wrap';
      t.parentNode.insertBefore(w, t); w.appendChild(t);
    });

    content.querySelectorAll('pre > code').forEach(function (code) {
      var btn = document.createElement('button');
      btn.type = 'button'; btn.className = 'copybtn';
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>copy</span>';
      btn.addEventListener('click', function () {
        if (!navigator.clipboard) return;
        navigator.clipboard.writeText(code.textContent).then(function () {
          btn.classList.add('done'); btn.querySelector('span').textContent = 'copied';
          setTimeout(function () { btn.classList.remove('done'); btn.querySelector('span').textContent = 'copy'; }, 1500);
        }, function () {});
      });
      code.parentElement.appendChild(btn);
    });
  }

  function buildPager(i) {
    var prev = DOCS[i - 1], next = DOCS[i + 1], html = '';
    if (prev) html += '<a class="prev" href="#' + prev.slug + '"><span class="dir">← Previous</span><span class="ttl">' + prev.title + '</span></a>';
    if (next) html += '<a class="next" href="#' + next.slug + '"><span class="dir">Next →</span><span class="ttl">' + next.title + '</span></a>';
    pager.innerHTML = html;
  }

  var spy = null;
  function startSpy() {
    if (spy) { spy.disconnect(); spy = null; }
    if (outline.hidden || !('IntersectionObserver' in window)) return;
    var links = {};
    outlineL.querySelectorAll('a').forEach(function (a) { links[a.getAttribute('href').split(':')[1]] = a; });
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        outlineL.querySelectorAll('a').forEach(function (a) { a.classList.remove('active'); });
        if (links[e.target.id]) links[e.target.id].classList.add('active');
      });
    }, { rootMargin: '-80px 0px -70% 0px' });
    content.querySelectorAll('h2, h3').forEach(function (h) { spy.observe(h); });
  }

  var currentSlug = null;

  async function load(slug, anchor) {
    var i = DOCS.findIndex(function (d) { return d.slug === slug; });
    var doc = DOCS[i];

    navList.querySelectorAll('a').forEach(function (a) { a.classList.toggle('active', a.dataset.slug === slug); });
    crumbNow.textContent = doc.title;
    navCur.textContent = doc.title;
    srcLink.href = REPO + doc.src;
    document.title = doc.title + ' — SirBoard docs';

    if (currentSlug !== slug) {
      content.innerHTML = '<div class="skel"><i class="t"></i><i></i><i></i><i></i></div>';
      try {
        var res = await fetch('./docs/' + slug + '.md', { cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        content.innerHTML = marked.parse(await res.text());
        decorate(slug);
        startSpy();
      } catch (err) {
        content.innerHTML = '<div class="docs-error"><b>Could not load <code>' + slug +
          '.md</code></b> — ' + err.message +
          '.<br>You can read it on <a href="' + REPO + doc.src + '" target="_blank" rel="noopener">GitHub</a> instead.</div>';
        outline.hidden = true;
      }
      currentSlug = slug;
      buildPager(i);
    }

    if (anchor) {
      var el = document.getElementById(anchor);
      if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); return; }
    }
    window.scrollTo({ top: 0 });
  }

  function route() { var h = parseHash(); load(h.slug, h.anchor); }
  window.addEventListener('hashchange', route);
  route();

  /* sidebar filter */
  var search = document.getElementById('navSearch');
  var noHits = document.getElementById('noHits');
  search.addEventListener('input', function () {
    var q = search.value.trim().toLowerCase(), hits = 0;
    navList.querySelectorAll('[data-group]').forEach(function (g) {
      var shown = 0;
      g.querySelectorAll('a').forEach(function (a) {
        var match = !q || a.textContent.toLowerCase().indexOf(q) !== -1;
        a.hidden = !match;
        if (match) { shown++; hits++; }
      });
      g.hidden = shown === 0;
    });
    noHits.hidden = hits !== 0;
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== search && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
      e.preventDefault(); search.focus(); search.select();
    }
    if (e.key === 'Escape' && document.activeElement === search) {
      search.value = ''; search.dispatchEvent(new Event('input')); search.blur();
    }
  });

  /* mobile nav */
  var nav = document.getElementById('docsNav'), toggle = document.getElementById('navToggle');
  toggle.addEventListener('click', function () {
    var open = nav.classList.toggle('collapsed') === false;
    toggle.setAttribute('aria-expanded', String(open));
  });
  navList.addEventListener('click', function (e) {
    if (e.target.closest('a') && window.innerWidth <= 880) {
      nav.classList.add('collapsed'); toggle.setAttribute('aria-expanded', 'false');
    }
  });
  function syncNav() { if (window.innerWidth > 880) nav.classList.remove('collapsed'); }
  window.addEventListener('resize', syncNav);
  syncNav();

  /* theme */
  document.getElementById('theme').addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('sirboard-theme', next); } catch (e) {}
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', next === 'light' ? '#f2efe7' : '#08090b');
  });
})();
</script>
</body>
